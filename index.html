<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07080F" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="description" content="INSANE RUMMY TRACKER — Personal Rummy tournament scoring & management" />
  <title>INSANE RUMMY TRACKER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080808;
      --bg-elevated: #0D0D0D;
      --card: #151515;
      --card-hover: #1B1B1B;
      --panel: #111111;
      --border: #2A2A2A;
      --border-subtle: #222222;
      --text: #FFFFFF;
      --text-muted: #A0A0A0;
      --text-dim: #666666;
      --red: #E50914;
      --red-bright: #FF1E2D;
      --red-dark: #B20710;
      --red-soft: rgba(229, 9, 20, 0.15);
      --green: #22C55E;
      --green-soft: rgba(34, 197, 94, 0.15);
      --yellow: #EAB308;
      --yellow-soft: rgba(234, 179, 8, 0.15);
      --shadow: 0 4px 24px rgba(0,0,0,0.45);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.35);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --header-h: 64px;
      --transition: 0.2s ease;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    [data-theme="light"] {
      --bg: #F7F7F7;
      --bg-elevated: #FFFFFF;
      --card: #FFFFFF;
      --card-hover: #F5F5F5;
      --panel: #FFFFFF;
      --border: #E5E5E5;
      --border-subtle: #EEEEEE;
      --text: #111111;
      --text-muted: #666666;
      --text-dim: #999999;
      --red: #D90416;
      --red-bright: #FF1E2D;
      --red-dark: #B20710;
      --red-soft: rgba(217, 4, 22, 0.1);
      --green: #16A34A;
      --green-soft: rgba(22, 163, 74, 0.12);
      --yellow: #CA8A04;
      --yellow-soft: rgba(202, 138, 4, 0.12);
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    }

    .custom-theme-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(115px,1fr)); gap:9px; margin-top:8px; }
    .theme-swatch { position:relative; min-height:42px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--text); display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; font:inherit; transition:.18s ease; }
    .theme-swatch:hover { transform:translateY(-1px); border-color:var(--red); }
    .theme-swatch.active { border-color:var(--red); box-shadow:0 0 0 2px var(--red-soft); }
    .theme-swatch span { width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,.35); flex:0 0 auto; }
    .theme-swatch input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    @media (prefers-reduced-motion: reduce) {
      .custom-theme-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(115px,1fr)); gap:9px; margin-top:8px; }
    .theme-swatch { position:relative; min-height:42px; border:1px solid var(--border); border-radius:10px; background:var(--panel); color:var(--text); display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; font:inherit; transition:.18s ease; }
    .theme-swatch:hover { transform:translateY(-1px); border-color:var(--red); }
    .theme-swatch.active { border-color:var(--red); box-shadow:0 0 0 2px var(--red-soft); }
    .theme-swatch span { width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,255,255,.35); flex:0 0 auto; }
    .theme-swatch input { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; }

    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========== HEADER ========== */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--header-h);
      background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg) 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(229, 9, 20, 0.35);
    }

    .logo svg { width: 20px; height: 20px; color: #fff; }

    .header-title {
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(90deg, var(--text) 0%, var(--red-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (min-width: 480px) {
      .header-title { font-size: 1.1rem; }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }

    .icon-btn:hover {
      background: var(--card-hover);
      border-color: var(--red);
      color: var(--red);
    }

    .icon-btn:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .icon-btn svg { width: 20px; height: 20px; }

    /* ========== LAYOUT ========== */
    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 100px;
      min-height: calc(100dvh - var(--header-h));
    }

    @media (min-width: 768px) {
      .app { max-width: 900px; padding: 24px; }
    }

    /* ========== BUTTONS ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
      white-space: nowrap;
      min-height: 48px;
    }

    .btn:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 2px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--red);
      color: #fff;
      box-shadow: 0 2px 12px rgba(229, 9, 20, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--red-bright);
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(229, 9, 20, 0.45);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--card-hover);
      border-color: var(--red);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
    }

    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
      background: var(--red-soft);
    }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid var(--red);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--red-soft);
    }

    .btn-sm {
      padding: 8px 14px;
      min-height: 36px;
      font-size: 0.875rem;
    }

    .btn-lg {
      padding: 16px 28px;
      min-height: 56px;
      font-size: 1.05rem;
    }

    .btn-block { width: 100%; }

    /* ========== CARDS ========== */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
    }

    .card:hover { border-color: var(--border); }

    .card-accent {
      border-left: 3px solid var(--red);
    }

    /* ========== FORMS ========== */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .form-input, .form-select {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      transition: border-color var(--transition);
      min-height: 48px;
    }

    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    .form-input::placeholder { color: var(--text-dim); }

    .form-input.error {
      border-color: var(--red);
    }

    .form-error {
      color: var(--red);
      font-size: 0.8rem;
      margin-top: 6px;
    }

    .form-hint {
      color: var(--text-dim);
      font-size: 0.8rem;
      margin-top: 6px;
    }

    /* ========== PLAYER COUNT PILLS ========== */
    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all var(--transition);
      min-width: 48px;
      text-align: center;
    }

    .pill:hover { border-color: var(--red); color: var(--text); }
    .pill.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* ========== MODE CARDS ========== */
    .mode-grid {
      display: grid;
      gap: 12px;
    }

    @media (min-width: 480px) {
      .mode-grid { grid-template-columns: 1fr 1fr; }
    }

    .mode-card {
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
    }

    .mode-card:hover { border-color: var(--red); }
    .mode-card.active {
      border-color: var(--red);
      background: var(--red-soft);
    }

    .mode-card h4 {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .mode-card p {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* ========== DASHBOARD ========== */
    .hero {
      text-align: center;
      padding: 32px 16px 24px;
    }

    .home-update-link{
      display:inline-flex;align-items:center;justify-content:center;
      margin:-14px auto 22px;padding:5px 10px;border:1px solid var(--red);
      border-radius:999px;background:var(--red-soft);color:var(--red-bright);
      font-size:.72rem;font-weight:800;letter-spacing:.02em;cursor:pointer;
      line-height:1.2;transition:all .2s ease;
    }
    .home-update-link:hover,.home-update-link:focus-visible{
      background:var(--red);color:#fff;transform:translateY(-1px);
      outline:none;box-shadow:0 3px 12px rgba(229,9,20,.22);
    }

    .hero h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--text) 30%, var(--red-bright) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (min-width: 480px) {
      .hero h1 { font-size: 2rem; }
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .hero-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
      margin: 0 auto;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 32px;
    }

    @media (min-width: 480px) {
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 768px) {
      .stats-grid { grid-template-columns: repeat(5, 1fr); }
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--red);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state h3 {
      font-size: 1.15rem;
      color: var(--text);
      margin-bottom: 8px;
    }

    /* ========== ROUND ENTRY ========== */
    .round-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .round-header .tournament-name {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
    }

    .round-header h2 {
      font-size: 1.4rem;
      font-weight: 800;
    }

    .player-score-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      transition: all var(--transition);
    }

    .player-score-card.is-winner {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .player-score-card.is-eliminated {
      opacity: 0.5;
      pointer-events: none;
    }

    .player-score-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .player-name {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .player-meta {
      display: flex;
      gap: 12px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .player-rank {
      font-weight: 700;
      color: var(--red);
      font-size: 0.9rem;
    }

    .score-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .score-input {
      flex: 1;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 700;
      text-align: center;
      min-height: 52px;
      font-family: var(--font);
    }

    .score-input:focus {
      outline: none;
      border-color: var(--red);
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    .score-input:disabled {
      opacity: 0.6;
      background: var(--panel);
    }

    .winner-btn {
      width: 44px;
      height: 44px;
      min-width: 44px;
      min-height: 44px;
      padding: 0;
      border-radius: var(--radius-sm);
      border: 2px solid var(--green);
      background: transparent;
      color: var(--green);
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .winner-btn:hover { background: var(--green-soft); }
    .winner-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    /* ========== STANDINGS ========== */
    .standings-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .standings-table th {
      text-align: left;
      padding: 10px 8px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }

    .standings-table td {
      padding: 12px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .standings-table tr:last-child td { border-bottom: none; }

    /* ========== ROUND-BY-ROUND POINTS TABLE ========== */
    .points-table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
    }

    .points-table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      font-size: 0.88rem;
    }

    .points-table th,
    .points-table td {
      padding: 11px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }

    .points-table th {
      background: var(--bg-elevated);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .points-table th:first-child,
    .points-table td:first-child {
      text-align: left;
      font-weight: 700;
      position: sticky;
      left: 0;
      background: var(--card);
      z-index: 2;
    }

    .points-table th:first-child {
      background: var(--bg-elevated);
      z-index: 3;
    }

    .points-table td.total-cell {
      font-weight: 800;
      color: var(--red);
      border-left: 1px solid var(--border);
    }

    .points-table .winner-score {
      color: var(--green);
      font-weight: 800;
    }

    .points-table .total-row td {
      background: var(--bg-elevated);
      font-weight: 800;
      border-bottom: none;
    }

    .points-table .total-row td:first-child {
      background: var(--bg-elevated);
    }


    .download-points-table-btn {
      margin-top: 10px;
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      min-width: 42px;
      padding: 0;
      border-radius: 8px;
      font-size: 1.05rem;
      line-height: 1;
    }

    .points-table-toggle {
      margin-top: 12px;
      margin-bottom: 16px;
    }

    .points-table-panel {
      margin-bottom: 24px;
    }

    .points-table-note {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 8px;
      text-align: center;
    }

    .rank-1 { color: var(--yellow); font-weight: 800; }
    .rank-2 { color: #C0C0C0; font-weight: 700; }
    .rank-3 { color: #CD7F32; font-weight: 700; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .status-active { background: var(--green-soft); color: var(--green); }
    .status-eliminated { background: var(--red-soft); color: var(--red); }
    .status-winner { background: var(--yellow-soft); color: var(--yellow); }
    .status-champion { background: linear-gradient(135deg, var(--red), var(--red-bright)); color: #fff; }

    /* ========== ROUND HISTORY ========== */
    .round-history-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .round-history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--card);
      cursor: pointer;
      transition: background var(--transition);
    }

    .round-history-header:hover { background: var(--card-hover); }

    .round-history-body {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: none;
    }

    .round-history-item.open .round-history-body { display: block; }

    /* ========== MODALS ========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      padding: 16px;
    }

    @media (min-width: 640px) {
      .modal-overlay {
        align-items: center;
      }
    }

    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      width: 100%;
      max-width: 480px;
      max-height: 90dvh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
      box-shadow: var(--shadow);
    }

    @media (min-width: 640px) {
      .modal {
        border-radius: var(--radius-lg);
        transform: translateY(20px) scale(0.96);
      }
      .modal-overlay.open .modal {
        transform: translateY(0) scale(1);
      }
    }

    .modal-overlay.open .modal {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 20px 0;
    }

    .modal-header h3 {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .modal-body { padding: 20px; }
    .modal-footer {
      padding: 0 20px 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-footer .btn { flex: 1; }

    /* ========== TOAST ========== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red); }

    /* ========== WINNER CELEBRATION ========== */
    .winner-screen {
      text-align: center;
      padding: 40px 20px;
    }

    .winner-trophy {
      font-size: 4rem;
      margin-bottom: 16px;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .winner-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--red);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .winner-name {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .winner-meta {
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    /* ========== HISTORY CARDS ========== */
    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      transition: all var(--transition);
    }

    .history-card:hover { border-color: var(--red); }

    .history-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .history-card h4 {
      font-size: 1rem;
      font-weight: 700;
    }

    .history-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    /* ========== TABS / NAV ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0;
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 90;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px 16px;
      color: var(--text-muted);
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--font);
      transition: color var(--transition);
      min-width: 64px;
    }

    .nav-item:hover, .nav-item.active { color: var(--red); }
    .nav-item svg { width: 22px; height: 22px; }

    .calculator-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calculator-grid .btn{min-height:48px;padding:8px;font-size:1rem}
    .minesweeper-view{max-width:760px;margin:0 auto}.mine-stats{display:flex;gap:12px;font-size:.85rem;color:var(--text-muted)}.mines-message{text-align:center;color:var(--text-muted);margin:8px 0 14px;font-weight:600}.mines-grid{display:grid;grid-template-columns:repeat(var(--mine-cols),1fr);gap:3px;max-width:620px;margin:0 auto;touch-action:manipulation}.mine-cell{aspect-ratio:1;border:1px solid var(--border);border-radius:5px;background:var(--surface-2);color:var(--text);font-weight:800;font-size:clamp(.65rem,2.8vw,1rem);padding:0;cursor:pointer;transition:transform .12s,background .12s}.mine-cell:hover{transform:scale(1.03)}.mine-cell.open{background:var(--bg);cursor:default}.mine-cell.flag{color:var(--red);font-size:clamp(.65rem,2.5vw,.95rem)}.mine-cell.open:nth-child(n){color:var(--text)}@media(max-width:520px){.mines-grid{gap:2px}.mine-cell{border-radius:3px}.mine-stats{flex-direction:column;gap:2px;text-align:right}}
    /* ========== SECTION HEADERS ========== */
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      margin-top: 24px;
    }

    .section-title:first-child { margin-top: 0; }

    /* ========== UTILITIES ========== */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .gap-4 { gap: 16px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-4 { margin-bottom: 16px; }
    .text-center { text-align: center; }
    .text-muted { color: var(--text-muted); }
    .text-red { color: var(--red); }
    .text-sm { font-size: 0.875rem; }
    .font-bold { font-weight: 700; }
    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }

    .saved-indicator {
      position: fixed;
      top: calc(var(--header-h) + 8px);
      right: 16px;
      background: var(--green);
      color: #fff;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 150;
      pointer-events: none;
    }

    .saved-indicator.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Player detail modal specific */
    .player-detail-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .player-detail-stat {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 12px;
      text-align: center;
    }

    .player-detail-stat .val {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--red);
    }

    .player-detail-stat .lbl {
      font-size: 0.7rem;
      color: var(--text-muted);

    }

    /* Progress bar for elimination */
    .elim-progress {
      height: 4px;
      background: var(--border);
      border-radius: 2px;

    }

    .elim-progress-bar {
      height: 100%;
      background: var(--red);
      border-radius: 2px;

    }

    /* Action bar for tournament */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    /* Confirm dialog */
    .confirm-msg {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .confirm-warn {
      color: var(--red);
      font-size: 0.85rem;
    }

.app{padding:12px;padding-bottom:28px;min-height:0}
/* nav on top */
.bottom-nav{position:sticky;top:var(--header-h);bottom:auto;left:0;right:0;gap:4px;padding:6px 8px;border-top:0;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:95}
.bottom-nav.hidden{display:none!important}
.nav-item{flex:1;min-width:0;padding:6px 2px;border-radius:12px;font-size:.66rem;font-weight:700;color:var(--text-muted);position:relative;transition:all .2s}
.nav-item svg{width:20px;height:20px}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--text);background:var(--red-soft);box-shadow:inset 0 0 0 1px rgba(229,9,20,.45),var(--glow)}
.nav-item.active svg{color:var(--red-bright);filter:drop-shadow(0 0 6px rgba(229,9,20,.7))}
[data-theme="light"] .nav-item.active svg{filter:none;color:var(--red)}
@media(min-width:768px){.bottom-nav{justify-content:center}.nav-item{flex:0 0 120px;flex-direction:row;justify-content:center;gap:8px;font-size:.8rem}}
/* cards & buttons */
.card{background:linear-gradient(180deg,var(--card),var(--panel));border:1px solid var(--border);box-shadow:var(--shadow);border-radius:16px}
.btn{font-family:var(--font);font-weight:700;letter-spacing:.01em;transition:transform .15s,box-shadow .25s,filter .25s}
.btn-primary{background:linear-gradient(135deg,var(--red-bright),var(--red) 55%,var(--red-dark));color:#fff;border:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 6px 22px -4px rgba(229,9,20,.6),0 0 22px rgba(229,9,20,.25)}
.btn-primary:hover:not(:disabled){filter:brightness(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 30px -2px rgba(229,9,20,.8),0 0 34px rgba(229,9,20,.45)}
.btn-primary:active:not(:disabled){transform:scale(.97)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid rgba(229,9,20,.5);box-shadow:0 0 14px rgba(229,9,20,.14)}
.btn-secondary:hover:not(:disabled){background:var(--red-soft);box-shadow:var(--glow);border-color:var(--red)}
[data-theme="light"] .btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -4px rgba(217,4,22,.45)}
input,select,textarea{color:var(--text);font-family:var(--font)}
input::placeholder,textarea::placeholder{color:var(--text-dim)}
input:focus,select:focus,textarea:focus{border-color:var(--red)!important;box-shadow:0 0 0 3px var(--red-soft)}
.pill.active{box-shadow:var(--glow)}
.modal{background:var(--card);border:1px solid var(--border)}
/* setup: actions on top */
.setup-actions{position:sticky;top:var(--header-h);z-index:80;display:flex;gap:8px;padding:8px 0 10px;margin-bottom:10px;background:var(--card);border-bottom:1px solid var(--border-subtle)}
/* compact points table */
.points-table-wrap{max-height:calc(100dvh - 250px);min-height:140px;overflow:auto;border-radius:16px;border:1px solid var(--border);box-shadow:var(--shadow)}
.points-table{min-width:0!important;width:100%;table-layout:fixed;font-size:clamp(.66rem,2.7vw,.88rem);font-variant-numeric:tabular-nums}
.points-table th,.points-table td{padding:clamp(3px,.9vh,8px) 3px;overflow:hidden;text-overflow:ellipsis}
.points-table th{font-size:clamp(.58rem,2.2vw,.72rem);letter-spacing:.02em}
.points-table th:first-child,.points-table td:first-child{width:clamp(40px,11vw,66px);padding-left:6px}
.points-table .total-row td{position:sticky;bottom:0;z-index:2;background:var(--bg-elevated);box-shadow:0 -1px 0 var(--border)}
.points-table .total-row td:first-child{z-index:4}
.points-table td.total-cell{text-shadow:0 0 12px rgba(229,9,20,.35)}
.points-table .winner-score{text-shadow:0 0 10px rgba(34,197,94,.55)}
[data-theme="light"] .points-table td.total-cell,[data-theme="light"] .points-table .winner-score{text-shadow:none}
[data-theme="light"] .points-table .winner-score{color:#15803D}
.standings-table{font-variant-numeric:tabular-nums}

/* ===== FUTURISTIC v5.1 ===== */
:root{--cy:0,229,255;--grid:rgba(120,150,255,.055);--font:'Exo 2','Plus Jakarta Sans',-apple-system,'Segoe UI',Roboto,sans-serif;--font-display:'Orbitron','Sora','Exo 2',sans-serif;--glass:rgba(8,10,22,.74)}
[data-theme="light"]{--cy:8,145,178;--grid:rgba(40,60,140,.07);--glass:rgba(255,255,255,.8);--bg:#EDF0F8}
body{font-weight:500}
#app{position:relative;z-index:1}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:38px 38px;-webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 15%,transparent 78%);mask-image:radial-gradient(ellipse 90% 70% at 50% 0,#000 15%,transparent 78%)}
.header{border-bottom:1px solid rgba(var(--cy),.25);box-shadow:0 1px 0 rgba(229,9,20,.25),0 8px 30px -12px rgba(var(--cy),.25)}
.header-title{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
@media(min-width:480px){.header-title{font-size:.95rem}}
.logo{border-radius:10px 4px 10px 4px;animation:pulseGlow 3s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 10px rgba(229,9,20,.45)}50%{box-shadow:0 0 24px rgba(229,9,20,.9),0 0 38px rgba(var(--cy),.25)}}
.icon-btn{border-radius:10px 4px 10px 4px}
.hero h1{font-family:var(--font-display);font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.15;background:linear-gradient(90deg,var(--text) 35%,var(--red-bright));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 14px rgba(229,9,20,.35))}
[data-theme="light"] .hero h1{filter:none}
.hero p{letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--text-muted)}
.card{position:relative;border-radius:6px 20px 6px 20px;border:1px solid rgba(var(--cy),.2);background:linear-gradient(160deg,var(--card),var(--panel))}
.card::before{content:"";position:absolute;top:-1px;left:16px;right:16px;height:2px;background:linear-gradient(90deg,transparent,var(--red-bright),rgba(var(--cy),.8),transparent);opacity:.85;pointer-events:none}
.section-title{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:10px}
.section-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(var(--cy),.5),transparent)}
.round-header h2{font-family:var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.btn{border-radius:6px 16px 6px 16px;text-transform:uppercase;letter-spacing:.07em;font-size:.82rem;position:relative;overflow:hidden}
.btn-lg{font-size:.9rem}
.btn-primary::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.btn-primary:hover::after{left:130%}
.btn-secondary{border-color:rgba(var(--cy),.55);box-shadow:0 0 14px rgba(var(--cy),.14),inset 0 0 12px rgba(var(--cy),.06)}
.btn-secondary:hover:not(:disabled){border-color:rgb(var(--cy));box-shadow:0 0 22px rgba(var(--cy),.35)}
.bottom-nav{border-bottom:1px solid rgba(var(--cy),.25)}
.nav-item{border-radius:6px 14px 6px 14px;text-transform:uppercase;letter-spacing:.06em;font-size:.6rem}
.nav-item.active{box-shadow:inset 0 0 0 1px rgba(229,9,20,.5),0 0 18px rgba(229,9,20,.35),0 4px 0 -2px var(--red-bright)}
.pill{border-radius:6px 12px 6px 12px}
.points-table-wrap{border-radius:6px 20px 6px 20px;border-color:rgba(var(--cy),.25)}
.points-table th{font-family:var(--font);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted)}
.points-table td.total-cell{font-family:var(--font-display);font-size:.9em}
.modal{border-radius:6px 22px 6px 22px;border:1px solid rgba(var(--cy),.3)}
.setup-actions{background:var(--card)}

/* ===== NO GLOW ===== */

.logo{animation:none!important}
.logo,.header,.icon-btn,.icon-btn:hover,.btn-primary,.btn-primary:hover:not(:disabled),.btn-secondary,.btn-secondary:hover:not(:disabled),.nav-item.active,.pill.active,[data-theme="light"] .btn-primary{box-shadow:none!important}

.nav-item.active{box-shadow:inset 0 0 0 1px rgba(229,9,20,.5)!important}
.btn-primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.18)!important}
.card{box-shadow:0 2px 10px rgba(0,0,0,.25)}

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // ============================================================
    // INSANE RUMMY TRACKER
    // ============================================================

    const STORAGE_KEY = 'insane_rummy_tracker_4_2';
    const THEME_KEY = 'insane_rummy_theme';

    // ---------- STATE ----------
    let state = {
      theme: 'dark', // dark | light | system
      customTheme: 'default',
      customAccent: '#E50914',
      settings: {
        sound: false,
        animations: true,
        confirmDestructive: true
      },
      activeTournament: null,
      history: [],
      view: 'home', // home | setup | play | standings | rounds | stats | results | history | settings | rummyAI
      activeNav: 'play',
      expandedRounds: {},
      editingRound: null
    };

    // ---------- UTILS ----------
    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
    }

    function now() {
      return new Date().toISOString();
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
        ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    }

    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }

    function toast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      container.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }, 2500);
    }

    function showSaved() {
      const el = document.getElementById('savedIndicator');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1500);
    }

    // ---------- STORAGE ----------
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const data = JSON.parse(raw);
          state.activeTournament = data.activeTournament || null;
          state.history = data.history || [];
          state.settings = { ...state.settings, ...(data.settings || {}) };
        }
      } catch (e) {
        console.warn('Failed to load state', e);
        toast('Could not load saved data', 'error');
      }
      // Theme
      try {
        const t = localStorage.getItem(THEME_KEY);
        if (t) state.theme = t;
      } catch (_) {}
      applyTheme();
    }

    function saveState() {
      try {
        const data = {
          activeTournament: state.activeTournament,
          history: state.history,
          settings: state.settings
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        localStorage.setItem(THEME_KEY, state.theme);
        showSaved();
      } catch (e) {
        console.warn('Save failed', e);
        toast('Save failed — storage full?', 'error');
      }
    }

    // ---------- THEME ----------
    function applyTheme() {
      let theme = state.theme;
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.setAttribute('data-theme', theme);
      const root = document.documentElement;
      const themes = {
        default: {accent:'#E50914', bright:'#FF1E2D', dark:'#B20710'},
        ocean: {accent:'#0EA5E9', bright:'#38BDF8', dark:'#0369A1'},
        emerald: {accent:'#10B981', bright:'#34D399', dark:'#047857'},
        violet: {accent:'#8B5CF6', bright:'#A78BFA', dark:'#6D28D9'},
        gold: {accent:'#F59E0B', bright:'#FBBF24', dark:'#B45309'},
        rose: {accent:'#E11D48', bright:'#FB7185', dark:'#9F1239'}
      };
      const preset = themes[state.customTheme] || themes.default;
      const accent = state.customTheme === 'custom' ? (state.customAccent || themes.default.accent) : preset.accent;
      const bright = state.customTheme === 'custom' ? accent : preset.bright;
      const dark = state.customTheme === 'custom' ? accent : preset.dark;
      root.style.setProperty('--red', accent);
      root.style.setProperty('--red-bright', bright);
      root.style.setProperty('--red-dark', dark);
      root.style.setProperty('--red-soft', accent + '26');
      const icon = document.getElementById('themeIcon');
      if (icon) {
        if (theme === 'light') {
          icon.innerHTML = '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
        } else {
          icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>';
        }
      }
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = theme === 'light' ? '#F7F7F7' : '#080808';
    }

    function cycleTheme() {
      const order = ['dark', 'light', 'system'];
      const idx = order.indexOf(state.theme);
      state.theme = order[(idx + 1) % order.length];
      applyTheme();
      saveState();
      toast(`Theme: ${state.theme.charAt(0).toUpperCase() + state.theme.slice(1)}`);
    }

    // ---------- CALCULATION ENGINE ----------
    function calculateFromRounds(tournament) {
      const players = tournament.players.map(p => ({
        ...p,
        totalScore: 0,
        wins: 0,
        eliminated: false,
        eliminationRound: null,
        highestRound: null,
        lowestRound: null,
        roundsPlayed: 0,
        scores: []
      }));

      const playerMap = {};
      players.forEach(p => { playerMap[p.id] = p; });

      tournament.rounds.forEach((round, idx) => {
        const roundNum = idx + 1;
        Object.entries(round.scores).forEach(([pid, score]) => {
          const p = playerMap[pid];
          if (!p) return;
          p.totalScore += score;
          p.roundsPlayed += 1;
          p.scores.push(score);
          if (p.highestRound === null || score > p.highestRound) p.highestRound = score;
          if (p.lowestRound === null || score < p.lowestRound) p.lowestRound = score;
        });
        if (round.winnerId && playerMap[round.winnerId]) {
          playerMap[round.winnerId].wins += 1;
        }

        // Elimination mode: check after each round
        if (tournament.mode === 'elimination') {
          players.forEach(p => {
            if (!p.eliminated && p.totalScore >= 101) {
              p.eliminated = true;
              p.eliminationRound = roundNum;
            }
          });
        }
      });

      // Rankings: lower score better; eliminated last
      const ranked = [...players].sort((a, b) => {
        if (tournament.mode === 'elimination') {
          if (a.eliminated !== b.eliminated) return a.eliminated ? 1 : -1;
        }
        if (a.totalScore !== b.totalScore) return a.totalScore - b.totalScore;
        // Tie-break by more wins
        if (a.wins !== b.wins) return b.wins - a.wins;
        return a.name.localeCompare(b.name);
      });

      ranked.forEach((p, i) => {
        p.rank = i + 1;
      });

      // Tournament status
      let status = tournament.status;
      let winnerId = tournament.winnerId;

      if (tournament.mode === 'standard') {
        if (tournament.rounds.length >= tournament.maxRounds) {
          status = 'completed';
          // Find winner(s) — lowest score
          const active = ranked.filter(p => !p.eliminated);
          if (active.length) {
            const best = active[0].totalScore;
            const winners = active.filter(p => p.totalScore === best);
            if (winners.length === 1) {
              winnerId = winners[0].id;
            } else {
              winnerId = null; // tie
            }
          }
        } else {
          status = 'active';
          winnerId = null;
        }
      } else {
        // Elimination
        const remaining = players.filter(p => !p.eliminated);
        if (remaining.length <= 1 && tournament.rounds.length > 0) {
          status = 'completed';
          winnerId = remaining.length === 1 ? remaining[0].id : null;
        } else {
          status = 'active';
          winnerId = null;
        }
      }

      return {
        players: ranked,
        status,
        winnerId
      };
    }

    function recalculate(tournament) {
      const result = calculateFromRounds(tournament);
      tournament.players = result.players;
      tournament.status = result.status;
      tournament.winnerId = result.winnerId;
      if (result.status === 'completed' && !tournament.completedAt) {
        tournament.completedAt = now();
      }
      return tournament;
    }

    // ============================================================
    // PLAY RUMMY VS AI — self-contained single-device game
    // ============================================================
    let rummyAI = null;

    const RUMMY_SUITS = [
      {s:'♠', c:'black'}, {s:'♥', c:'red'}, {s:'♦', c:'red'}, {s:'♣', c:'black'}
    ];
    const RUMMY_RANKS = [
      {r:'A',v:1},{r:'2',v:2},{r:'3',v:3},{r:'4',v:4},{r:'5',v:5},{r:'6',v:6},{r:'7',v:7},
      {r:'8',v:8},{r:'9',v:9},{r:'10',v:10},{r:'J',v:11},{r:'Q',v:12},{r:'K',v:13}
    ];

    
function rCard(rank, suit, joker=false) {
      return {id:uid(), rank, suit, value:rank==='A'?1:(rank==='J'?11:rank==='Q'?12:rank==='K'?13:Number(rank)||0), joker:!!joker, wild:false};
    }
    function makeRummyDeck(deckCount=1) {
      const d=[];
      for(let deckNo=0;deckNo<deckCount;deckNo++){
        RUMMY_SUITS.forEach(s=>RUMMY_RANKS.forEach(r=>d.push(rCard(r.r,s.s,false))));
        d.push(rCard('JOKER','★',true), rCard('JOKER','★',true));
      }
      return d;
    }
    function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
    function rCardLabel(c){ return c.joker ? '🃏' : `${c.rank}${c.suit}`; }
    function rCardPoints(c){ return (c.joker || c.wild)?0:Math.min(c.value,10); }
    function rIsWild(c,g){ return !!c && (c.joker || (g && g.wildRank && c.rank===g.wildRank)); }
    function rReal(c,g){ return !!c && !rIsWild(c,g); }
    function rCardColor(c){ return c.joker || c.wild ? 'joker' : ((c.suit==='♥'||c.suit==='♦')?'red':''); }

    // Return every physically possible group for the supplied cards.  This is
    // deliberately independent of the player's visual hand order.
    function rValidGroup(group,g,opts={}){
      const pure=!!opts.pure;
      if(!Array.isArray(group)||group.length<3) return false;
      if(group.some(c=>!c)) return false;
      const wild=group.filter(c=>rIsWild(c,g));
      const real=group.filter(c=>rReal(c,g));
      if(!real.length) return false;

      // A pure sequence has no printed/wild joker substitutes.
      if(pure){
        if(wild.length) return false;
        if(!real.every(c=>c.suit===real[0].suit)) return false;
        const vals=real.map(c=>c.value).sort((a,b)=>a-b);
        if(new Set(vals).size!==vals.length) return false;
        // Only A-2-3 and Q-K-A are the two Ace conventions.
        const isRun=(arr)=>{
          if(arr.length<3) return false;
          if(arr.includes(1) && arr.includes(13)) {
            const nonAce=arr.filter(v=>v!==1).sort((a,b)=>a-b);
            return nonAce.length>=2 && nonAce[0]===12 && nonAce[1]===13 && arr.length===3;
          }
          for(let i=1;i<arr.length;i++) if(arr[i]!==arr[i-1]+1) return false;
          return true;
        };
        return isRun(vals);
      }

      // Sets: same rank, distinct suits among real cards. Wilds fill missing suits.
      if(real.every(c=>c.rank===real[0].rank) && new Set(real.map(c=>c.suit)).size===real.length && group.length<=4){
        return true;
      }

      // Sequence: same suit, distinct ranks; wilds fill missing positions.
      if(!real.every(c=>c.suit===real[0].suit)) return false;
      const vals=[...new Set(real.map(c=>c.value))].sort((a,b)=>a-b);
      if(vals.length!==real.length) return false;
      const n=group.length;
      // Enumerate all legal windows of length n in A-low and A-high conventions.
      const windows=[];
      for(let start=1;start<=14-n;start++) windows.push(Array.from({length:n},(_,i)=>start+i));
      // Q-K-A is represented as [1,12,13].
      if(n===3) windows.push([1,12,13]);
      for(const w of windows){
        const missing=w.filter(v=>!vals.includes(v)).length;
        if(missing===wild.length && vals.every(v=>w.includes(v))) return true;
      }
      return false;
    }

    // Exhaustive partition search over actual physical cards.  A winning
    // partition must cover every card exactly once and contain >=2 sequences,
    // including >=1 pure sequence.
    function rFindMeldPartition(hand,g){
      const cards=[...hand];
      const n=cards.length;
      const memo=new Map();
      const key=(mask,seq,pure)=>`${mask}|${seq?'1':'0'}|${pure?'1':'0'}`;
      function candidatesFor(i,mask){
        const out=[];
        const available=[];
        for(let x=i;x<n;x++) if(!(mask&(1<<x))) available.push(x);
        // Candidate groups are generated from combinations up to 4 cards.
        const combos=(arr,k,pos,pick)=>{
          if(pick.length===k){
            const group=pick.map(ix=>cards[ix]);
            if(rValidGroup(group,g)) out.push(group);
            return;
          }
          for(let z=pos;z<arr.length-(k-pick.length)+1;z++) combos(arr,k,z+1,pick.concat(arr[z]));
        };
        [3,4].forEach(k=>combos(available,k,0,[]));
        return out;
      }
      function rec(mask,seqCount,pureFound,groups){
        if(mask===((1<<n)-1)){
          return {valid:seqCount>=2 && pureFound,groups};
        }
        const k=key(mask,seqCount>=2,pureFound);
        if(memo.has(k)) return null;
        // Pick first unused card to reduce branching.
        let i=0; while(mask&(1<<i)) i++;
        const candidates=candidatesFor(i,mask);
        for(const group of candidates){
          const groupIdx=group.map(c=>cards.findIndex((x,ix)=>x.id===c.id && !(mask&(1<<ix))));
          let nm=mask; groupIdx.forEach(ix=>nm|=(1<<ix));
          const isSeq=rIsSequenceGroup(group,g), isPure=isSeq && rValidGroup(group,g,{pure:true});
          const result=rec(nm,seqCount+(isSeq?1:0),pureFound||isPure,groups.concat([group]));
          if(result) return result;
        }
        memo.set(k,true);
        return null;
      }
      return rec(0,0,false,[]) || {valid:false,groups:[]};
    }
    function rIsSequenceGroup(group,g){
      if(group.length<3) return false;
      const wild=group.filter(c=>rIsWild(c,g)), real=group.filter(c=>rReal(c,g));
      if(!real.length || !real.every(c=>c.suit===real[0].suit)) return false;
      const vals=[...new Set(real.map(c=>c.value))].sort((a,b)=>a-b);
      if(vals.length!==real.length) return false;
      const n=group.length;
      const windows=[];
      for(let st=1;st<=14-n;st++) windows.push(Array.from({length:n},(_,i)=>st+i));
      if(n===3) windows.push([1,12,13]);
      return windows.some(w=>wild.length===w.filter(v=>!vals.includes(v)).length && vals.every(v=>w.includes(v)));
    }
    function rIsWinning(hand,g){
      if(!hand || hand.length!==13) return false;
      return rFindMeldPartition(hand,g).valid;
    }
    function rDeadwood(hand,g){
      const part=rFindMeldPartition(hand,g);
      if(part.valid) return 0;
      // Approximate deadwood for AI discard selection.
      const used=new Set();
      (part.groups||[]).forEach(gr=>gr.forEach(c=>used.add(c.id)));
      return hand.filter(c=>!used.has(c.id)).reduce((sum,c)=>sum+rCardPoints(c),0);
    }
    function rHandPotential(hand,g){
      const part=rFindMeldPartition(hand,g);
      if(part.valid)return 10000;
      let score=0;
      for(const c of hand){
        if(rIsWild(c,g)) { score+=18; continue; }
        const near=hand.filter(x=>x.id!==c.id && rReal(x,g) && x.suit===c.suit && Math.abs(x.value-c.value)<=2).length;
        const same=hand.filter(x=>x.id!==c.id && rReal(x,g) && x.rank===c.rank).length;
        score += Math.min(12,near*5+same*4);
      }
      return score;
    }
    function rDiscardScore(hand,c,g){
      const remain=hand.filter(x=>x.id!==c.id);
      let score=rDeadwood(remain,g)*10;
      score += rHandPotential(remain,g);
      const neighbors=remain.filter(x=>rReal(x,g)&&rReal(c,g)&&x.suit===c.suit&&Math.abs(x.value-c.value)<=2).length;
      const sameRank=remain.filter(x=>rReal(x,g)&&rReal(c,g)&&x.rank===c.rank).length;
      if(rIsWild(c,g)) score += 500;
      score += neighbors*55 + sameRank*45;
      score += rCardPoints(c);
      return score;
    }
    function rChooseAIDiscard(p,g){
      let best=null,bestScore=Infinity;
      for(const c of p.hand){
        const sc=rDiscardScore(p.hand,c,g);
        if(sc<bestScore){bestScore=sc;best=c;}
      }
      return best;
    }
    function rAIShouldTakeDiscard(p,top,g){
      if(!top || rIsWild(top,g)) return false;
      // Never pick a discard merely because it is "related". The AI first
      // tests whether taking it can create a genuinely better 13-card hand.
      const currentDead=rDeadwood(p.hand,g);
      const currentPotential=rHandPotential(p.hand,g);
      const test=[...p.hand,top];
      const best=rChooseAIDiscard({hand:test},g);
      if(!best || best.id===top.id) return false; // prevents pickup -> throw-back
      const resulting=test.filter(c=>c.id!==best.id);
      const newDead=rDeadwood(resulting,g);
      const newPotential=rHandPotential(resulting,g);
      if(rIsWinning(resulting,g)) return true;
      // Require a real structural improvement, not just a matching rank.
      if(newDead < currentDead) return true;
      if(newDead===currentDead && newPotential > currentPotential + 8) return true;
      // Strong evidence: the card completes a 3+ card sequence/set candidate.
      const sameSuit= p.hand.filter(c=>rReal(c,g)&&c.suit===top.suit&&Math.abs(c.value-top.value)<=2);
      const sameRank= p.hand.filter(c=>rReal(c,g)&&c.rank===top.rank);
      return (sameSuit.length>=2 || sameRank.length>=2) && newPotential>currentPotential;
    }

        if(startBtn){
          startBtn.onclick=()=>{
            try { startRummyAI(aiCount); }
            catch(err){ console.error('Rummy start error:',err); toast('Could not start Rummy. Please try again.'); }
          };
        }
        return;
      }
      const g=rummyAI, handEl=document.getElementById('rHand');
      if(!handEl)return;
      const cards=[...handEl.querySelectorAll('[data-card-id]')];
      cards.forEach(el=>{
        el.addEventListener('click',e=>{
          if(g.animating||g.turn!==0||g.phase!=='playing')return;
          const id=el.dataset.cardId;
          if(g.selected===id){g.selected=null;render();return;}
          if(g.selected){
            swapRummyCards(g.selected,id);
            return;
          }
          g.selected=id; render();
        });
        el.addEventListener('pointerdown',e=>rPointerDown(e,el));
      });
      document.getElementById('rDrawPile')?.addEventListener('click',()=>humanDraw(false));
      document.getElementById('rDiscardPile')?.addEventListener('click',()=>{ if(rummyAI?.canDiscard && rummyAI?.selected) humanDiscard(); else humanDraw(true); });
            document.getElementById('rNewGame')?.addEventListener('click',()=>{rummyAI.screen='setup';render();});
      document.getElementById('rNewGameWin')?.addEventListener('click',()=>{rummyAI.screen='setup';render();});
      document.getElementById('rExit')?.addEventListener('click',()=>{rummyAI=null;state.view='home';render();});
    }

    function rPointerDown(e,el){
      const g=rummyAI;
      if(!g||g.animating||g.turn!==0||g.phase!=='playing')return;
      const id=el.dataset.cardId, startX=e.clientX, startY=e.clientY;
      let moved=false;
      const move=(ev)=>{
        if(Math.hypot(ev.clientX-startX,ev.clientY-startY)>8)moved=true;
      };
      const up=(ev)=>{
        document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);
        if(!moved)return;
        const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-card-id]');
        if(target && target.dataset.cardId!==id) swapRummyCards(id,target.dataset.cardId);
      };
      document.addEventListener('pointermove',move,{passive:true});
      document.addEventListener('pointerup',up,{passive:true});
    }

    function swapRummyCards(aId,bId){
      const g=rummyAI;if(!g||g.animating||aId===bId)return;
      const hand=g.players[0].hand,a=hand.findIndex(c=>c.id===aId),b=hand.findIndex(c=>c.id===bId);
      if(a<0||b<0)return;
      g.animating=true;
      [hand[a],hand[b]]=[hand[b],hand[a]];
      g.selected=null; g.newCardId=null; render();
      setTimeout(()=>{if(rummyAI){rummyAI.animating=false;render();}},240);
    }

    function startRummyAI(aiCount){
      const names=['You','Alex AI','Riley AI','Jordan AI','Taylor AI','Morgan AI'];
      const playerCount=Math.max(2,Math.min(6,(Number(aiCount)||1)+1));
      const deck=shuffle(makeRummyDeck(playerCount>4?2:1));
      const wildCard=deck.find(c=>!c.joker);
      const wildRank=wildCard ? wildCard.rank : 'A';
      const players=Array.from({length:playerCount},(_,i)=>({name:names[i],hand:[]}));

      // Deal the actual game cards first. The animation is only a visual
      // presentation of these exact card objects — it never creates a second hand.
      for(let round=0;round<13;round++){
        players.forEach(p=>{ const c=deck.pop(); if(c)p.hand.push(c); });
      }
      const discard=[];
      const firstDiscard=deck.pop();
      if(firstDiscard) discard.push(firstDiscard);
      const dealSnapshot=players[0].hand.slice();

      rummyAI={
        screen:'game', phase:'dealing', turnCount:0, maxAutoTurns:300,
        players, deck, discard, turn:0, wildRank, selected:null,
        newCardId:null, canDiscard:false, dragId:null, animating:true,
        aiThinking:null, aiDrawId:null, aiDiscardId:null,
        dealProgress:0, dealSnapshot, dealOrder:dealSnapshot.map(c=>c.id),
        status:'Shuffling and dealing...',
        log:[`Game started. Wild Joker is ${wildRank}. Shuffling and dealing...`]
      };
      render();
      runRummyDealAnimation();
    }

    function runRummyDealAnimation(){
      const g=rummyAI;
      if(!g || g.phase!=='dealing') return;
      const step=()=>{
        if(!rummyAI || rummyAI!==g || g.phase!=='dealing') return;
        g.dealProgress=Math.min(13,(g.dealProgress||0)+1);
        g.status=`Dealing card ${g.dealProgress} of 13...`;
        render();
        if(g.dealProgress<13){
          setTimeout(step,135);
          return;
        }
        setTimeout(()=>{
          if(!rummyAI || rummyAI!==g || g.phase!=='dealing') return;
          // Restore the exact original card-object order. No fresh cards are generated.
          const byId=new Map(g.players[0].hand.map(c=>[c.id,c]));
          g.players[0].hand=g.dealSnapshot.map(c=>byId.get(c.id)).filter(Boolean);
          g.phase='playing';
          g.animating=false;
          g.status='Your turn — tap the draw pile or discard pile to draw a card.';
          g.log.push('Cards dealt. Your turn.');
          render();
        },450);
      };
      setTimeout(step,300);
    }

    function humanDraw(fromDiscard){
      const g=rummyAI;if(!g||g.turn!==0||g.phase!=='playing'||g.canDiscard||g.animating)return;
      if(fromDiscard){
        if(!g.discard.length)return;
        g.animating=true; const c=g.discard.pop();g.players[0].hand.push(c);g.newCardId=c.id;g.selected=c.id;
        g.status='You picked the discard. Reorganize your 14 cards, then tap a card and tap the discard pile to discard.';
        g.log.push(`You picked ${rCardLabel(c)} from the discard pile.`);
      } else {
        if(!g.deck.length)recycleRummyDeck();
        if(!g.deck.length)return;
        g.animating=true; const c=g.deck.pop();g.players[0].hand.push(c);g.newCardId=c.id;g.selected=c.id;
        g.status='You drew a card. Reorganize your 14 cards, then tap a card and tap the discard pile to discard.';
        g.log.push(`You drew ${rCardLabel(c)} from the draw pile.`);
      }
      g.canDiscard=true; render();
      setTimeout(()=>{if(rummyAI){rummyAI.animating=false;render();}},350);
    }
    function recycleRummyDeck(){
      const g=rummyAI;if(g.discard.length<=1)return;
      const top=g.discard.pop();g.deck=shuffle(g.discard);g.discard=[top];g.log.push('Discard pile reshuffled into the draw pile.');
    }
    function humanDiscard(){
      const g=rummyAI;if(!g||g.turn!==0||!g.canDiscard||!g.selected||g.animating)return;
      const idx=g.players[0].hand.findIndex(c=>c.id===g.selected);if(idx<0)return;
      const c=g.players[0].hand[idx];g.animating=true;g.players[0].hand.splice(idx,1);g.discard.push(c);
      g.canDiscard=false;g.selected=null;g.newCardId=null;g.log.push(`You discarded ${rCardLabel(c)}.`);
      g.status='You discarded. Checking your hand...';render();
      setTimeout(()=>{
        if(!rummyAI)return;
        rummyAI.animating=false;
        if(rummyAI.players[0].hand.length===13 && rIsWinning(rummyAI.players[0].hand,rummyAI)) { endRummyGame(0,'Valid hand — you declared and won!'); return; }
        nextRummyTurn();
      },300);
    }
    function nextRummyTurn(){
      const g=rummyAI;if(!g||g.phase!=='playing')return;
      g.turnCount=(g.turnCount||0)+1;
      g.turn=(g.turn+1)%g.players.length;
      g.status=`${g.players[g.turn].name}'s turn...`;render();
      if(g.turn!==0)setTimeout(aiTurn,650);
    }
    function rAutoShouldTakeDiscard(p,top,g){
      if(!top)return false;
      const before=rHandPotential(p.hand,g);
      const test=[...p.hand,top];
      const best=rChooseAIDiscard({hand:test},g);
      if(!best)return false;
      const after=test.filter(c=>c.id!==best.id);
      if(rIsWinning(after,g))return true;
      const beforeDead=rDeadwood(p.hand,g), afterDead=rDeadwood(after,g);
      // Never pick a discard merely to throw it back.
      if(best.id===top.id)return false;
      // Pick only when it creates a measurable structural improvement.
      return afterDead<beforeDead || rHandPotential(after,g)>before+10;
    }
    function aiTurnGeneric(playerIndex){
      const g=rummyAI;if(!g||g.phase!=='playing'||g.turn!==playerIndex||g.animating)return;
      const p=g.players[playerIndex];
      const top=g.discard[g.discard.length-1];
      let drawn=null,fromDiscard=false;
      if(top && rAutoShouldTakeDiscard(p,top,g)){drawn=g.discard.pop();fromDiscard=true;}
      else {if(!g.deck.length)recycleRummyDeck();if(!g.deck.length){nextRummyTurn();return;}drawn=g.deck.pop();}
      p.hand.push(drawn);
      g.log.push(`${p.name} ${fromDiscard?'picked':'drew'} ${rCardLabel(drawn)}.`);
      g.aiDrawId=drawn.id;g.newCardId=drawn.id;
      g.status=`${p.name} ${fromDiscard?'picked from the discard':'drew a card'} — thinking...`;
      g.aiThinking=playerIndex;
      g.animating=true;render();
      setTimeout(()=>{
        if(!rummyAI||rummyAI!==g||g.phase!=='playing')return;
        const best=rChooseAIDiscard(p,g);
        if(!best){g.animating=false;nextRummyTurn();return;}
        const idx=p.hand.findIndex(c=>c.id===best.id);if(idx<0){g.animating=false;nextRummyTurn();return;}
        p.hand.splice(idx,1);g.discard.push(best);g.aiDiscardId=best.id;
        g.aiThinking=null;
        g.log.push(`${p.name} discarded ${rCardLabel(best)}.`);
        g.status=`${p.name} discarded ${rCardLabel(best)}.`;render();
        setTimeout(()=>{
          if(!rummyAI||rummyAI!==g)return;
          g.aiDiscardId=null;g.aiDrawId=null;g.newCardId=null;g.animating=false;
          if(rIsWinning(p.hand,g)){endRummyGame(playerIndex,`${p.name} made a valid declaration and won!`);return;}
          nextRummyTurn();
        },600);
      },550);
    }
    function aiTurn(){ aiTurnGeneric(rummyAI?.turn); }
    function endRummyGame(winner,message){const g=rummyAI;g.phase='gameover';g.winner=winner;g.canDiscard=false;g.animating=false;g.status=message;g.log.push(message);render();}

    // ----- SETUP -----
    function renderSetup() {
      return `
        <div class="section-title">Create Tournament</div>
        <div class="card">
          <div class="setup-actions"><button class="btn btn-secondary" id="setupCancel" style="flex:1">Cancel</button><button class="btn btn-primary" id="setupStart" style="flex:2">Start Tournament</button></div>
          <div class="form-group">

          </div>

          <div class="form-group">
            <label class="form-label">Number of Players</label>
            <div class="pill-group" id="playerCountPills">
              ${[2,3,4,5,6,7,8].map(n => `<button type="button" class="pill ${n===4?'active':''}" data-count="${n}">${n}</button>`).join('')}
            </div>
          </div>

          <div class="form-group">
