            <div class="mode-grid" id="modeCards">
              <button type="button" class="mode-card active" data-mode="standard">
                <h4>Standard Mode</h4>
                <p>Fixed number of rounds. Lowest total penalty wins.</p>
              </button>
              <button type="button" class="mode-card" data-mode="elimination">
                <h4>100-Point Elimination</h4>
                <p>Reach 101+ and you're out. Last player standing wins.</p>
              </button>
            </div>
          </div>

          <div class="form-group" id="roundsGroup">
            <label class="form-label">Number of Rounds</label>
            <div class="pill-group" id="roundsPills">
              ${[1,2,3,4,5,6,8,10,12,15,20].map(n => `<button type="button" class="pill ${n===5?'active':''}" data-rounds="${n}">${n}</button>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function bindSetup() {
      let playerCount = 4;
      let mode = 'standard';
      let maxRounds = 5;

      function renderNameFields() {
        const container = document.getElementById('playerNameFields');
        let html = '';
        for (let i = 1; i <= playerCount; i++) {
          html += `
            <input class="form-input mb-2 player-name-input" type="text"
              placeholder="Player ${i}" data-idx="${i}" maxlength="24" autocomplete="off"
              value="Player ${i}" />
          `;
        }
        container.innerHTML = html;
      }

      renderNameFields();

      document.getElementById('playerCountPills').addEventListener('click', e => {
        const btn = e.target.closest('.pill');
        if (!btn) return;
        document.querySelectorAll('#playerCountPills .pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        playerCount = parseInt(btn.dataset.count, 10);
        renderNameFields();
      });

      document.getElementById('modeCards').addEventListener('click', e => {
        const card = e.target.closest('.mode-card');
        if (!card) return;
        document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        mode = card.dataset.mode;
        document.getElementById('roundsGroup').style.display = mode === 'standard' ? '' : 'none';
      });

      document.getElementById('roundsPills').addEventListener('click', e => {
        const btn = e.target.closest('.pill');
        if (!btn) return;
        document.querySelectorAll('#roundsPills .pill').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        maxRounds = parseInt(btn.dataset.rounds, 10);
      });

      document.getElementById('setupCancel').addEventListener('click', () => {
        state.view = 'home';
        render();
      });

      document.getElementById('setupStart').addEventListener('click', () => {
        const name = document.getElementById('tName').value.trim() || 'INSANE RUMMY TOURNAMENT';
        const nameInputs = document.querySelectorAll('.player-name-input');
        const names = [];
        const seen = new Set();
        let valid = true;

        nameInputs.forEach((input, i) => {
          let n = input.value.trim() || `Player ${i + 1}`;
          if (seen.has(n.toLowerCase())) {
            input.classList.add('error');
            valid = false;
          } else {
            input.classList.remove('error');
            seen.add(n.toLowerCase());
            names.push(n);
          }
        });

        if (!valid) {
          toast('Player names must be unique', 'error');
          return;
        }

        const players = names.map(n => ({
          id: uid(),
          name: n,
          totalScore: 0,
          wins: 0,
          eliminated: false,
          eliminationRound: null,
          rank: 0,
          highestRound: null,
          lowestRound: null,
          roundsPlayed: 0,
          scores: []
        }));

        state.activeTournament = {
          id: uid(),
          name,
          createdAt: now(),
          completedAt: null,
          mode,
          maxRounds: mode === 'standard' ? maxRounds : 999,
          players,
          rounds: [],
          status: 'active',
          winnerId: null
        };

        saveState();
        state.view = 'play';
        state.activeNav = 'play';
        render();
        toast('Tournament started!');
      });
    }

    // ----- ROUND-BY-ROUND POINTS TABLE -----
    function renderPointsTable(t) {
      // Preserve the original tournament player order rather than sorting by standings.
      const playerOrder = [...t.players];
      const rounds = t.rounds || [];
      const roundCount = t.mode === 'standard' ? t.maxRounds : rounds.length;

      return `
        <div class="points-table-wrap">
          <table class="points-table">
            <thead>
              <tr>
                <th>Round</th>
                ${playerOrder.map(p => `<th>${escapeHtml(p.name)}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${Array.from({ length: roundCount }, (_, i) => {
                const roundNumber = i + 1;
                const round = rounds.find(r => Number(r.roundNumber) === roundNumber);
                return `
                  <tr>
                    <td>R${roundNumber}</td>
                    ${playerOrder.map(p => {
                      const score = round?.scores?.[p.id];
                      const isWinner = round && round.winnerId === p.id;
                      return `<td class="${isWinner ? 'winner-score' : ''}">${isWinner ? 'W' : (score !== undefined ? score : '—')}</td>`;
                    }).join('')}
                  </tr>
                `;
              }).join('')}
              <tr class="total-row">
                <td class="total-cell">Total</td>
                ${playerOrder.map(p => `<td class="total-cell">${p.totalScore}</td>`).join('')}
              </tr>
            </tbody>
          </table>
        </div>
        <button class="btn btn-secondary download-points-table-btn" data-download-points-table title="Download Points Table" aria-label="Download Points Table">⬇️</button>
        <p class="points-table-note">Winner of each round is shown as W · — means no score recorded for that round</p>
      `;
    }

    // ----- PLAY (ROUND ENTRY) -----
    function renderPlay() {
      const t = state.activeTournament;
      if (!t) {
        state.view = 'home';
        return renderHome();
      }

      // Safety: ensure elimination tournaments with <=1 remaining are marked completed
      if (t.status !== 'completed' && t.mode === 'elimination') {
        const remaining = t.players.filter(p => !p.eliminated);
        if (remaining.length <= 1 && t.rounds.length > 0) {
          recalculate(t);
          saveState();
        }
      }

      const isCompleted = t.status === 'completed';
      const roundNum = t.rounds.length + 1;
      const activePlayers = t.players.filter(p => !p.eliminated);
      const winner = t.winnerId ? t.players.find(p => p.id === t.winnerId) : null;
      const isTie = isCompleted && !t.winnerId && t.mode === 'standard';

      let headerRound = isCompleted
        ? (t.mode === 'elimination' ? 'Last Player Standing' : 'Tournament Complete')
        : (t.mode === 'standard'
          ? `Round ${roundNum} / ${t.maxRounds}`
          : `Round ${roundNum}`);

      // Live points table (always visible)
      const standingsTable = renderPointsTable(t);

      // After final round: show champion declaration under the table (stay on this page so scores can still be edited)
      if (isCompleted) {
        let championHtml = '';
        if (winner) {
          championHtml = `
            <div class="card" style="text-align:center;padding:28px 20px;margin-bottom:16px;border-color:var(--green)">
              <div class="winner-label" style="margin-bottom:8px">Champion 🏆</div>
              <div class="winner-name" style="font-size:1.75rem;margin-bottom:6px">${escapeHtml(winner.name)}</div>
              <div class="text-muted text-sm">
                Final Score: ${winner.totalScore} · Wins: ${winner.wins}<br>
                ${t.rounds.length} round${t.rounds.length !== 1 ? 's' : ''} · ${t.mode === 'elimination' ? '100-Point Elimination' : 'Standard Mode'}
              </div>
            </div>
          `;
        } else if (isTie) {
          const best = Math.min(...t.players.map(p => p.totalScore));
          const tied = t.players.filter(p => p.totalScore === best);
          championHtml = `
            <div class="card" style="text-align:center;padding:28px 20px;margin-bottom:16px">
              <div class="winner-label" style="margin-bottom:8px">🤝 Tournament Tied</div>
              <div class="winner-name" style="font-size:1.35rem;margin-bottom:6px">${tied.map(p => escapeHtml(p.name)).join(', ')}</div>
              <div class="text-muted text-sm">Tied at ${best} points</div>
            </div>
          `;
        } else {
          championHtml = `
            <div class="card" style="text-align:center;padding:28px 20px;margin-bottom:16px">
              <div class="winner-label">Tournament Complete</div>
            </div>
          `;
        }

        return `
          <div class="round-header">
            <div class="tournament-name">${escapeHtml(t.name)}</div>
            <h2>${headerRound}</h2>
            <p class="text-sm text-muted mt-2">${t.mode === 'elimination' ? '100-Point Elimination' : 'Standard Mode'} · ${t.rounds.length} rounds played</p>
          </div>

          <div class="section-title" style="margin-top:0">Final Points Table</div>
          ${standingsTable}

          ${championHtml}

          <div class="action-bar">
            ${t.rounds.length > 0 ? `<button class="btn btn-secondary btn-sm" id="undoRoundBtn">Undo Last Round</button>` : ''}
            <button class="btn btn-primary btn-sm" id="newFromPlayBtn">New Tournament</button>
            <button class="btn btn-ghost btn-sm" id="homeFromPlayBtn">Back to Home</button>
          </div>
          <p class="text-center text-muted text-sm mt-3">You can still edit or undo the last round if scores were entered incorrectly.</p>
        `;
      }

      // Active tournament — score entry
      return `
        <div class="round-header">
          <div class="tournament-name">${escapeHtml(t.name)}</div>
          <h2>${headerRound}</h2>
          <p class="text-sm text-muted mt-2">${t.mode === 'elimination' ? '100-Point Elimination' : 'Standard Mode'} · ${activePlayers.length} active</p>
        </div>

        <div class="section-title" style="margin-top:0">Live Points Table</div>
        ${standingsTable}

        <div class="section-title">Enter Round Scores</div>
        <div id="scoreCards">
          ${activePlayers.map(p => {
            const total = p.totalScore;
            const pct = t.mode === 'elimination' ? Math.min(100, (total / 100) * 100) : 0;
            return `
              <div class="player-score-card" data-pid="${p.id}" id="card-${p.id}">
                <div class="player-score-top">
                  <div>
                    <div class="player-name">${escapeHtml(p.name)}</div>
                    <div class="player-meta">
                      <span>Total: <strong>${total}</strong></span>
                      <span>Wins: ${p.wins}</span>
                      <span class="player-rank">#${p.rank}</span>
                    </div>
                    ${t.mode === 'elimination' ? `
                      <div class="elim-progress">
                        <div class="elim-progress-bar" style="width:${pct}%"></div>
                      </div>
                    ` : ''}
                  </div>
                </div>
                <div class="score-input-row">
                  <input type="number" class="score-input" id="score-${p.id}"
                    inputmode="numeric" pattern="[0-9]*" min="0" max="999"
                    placeholder="0" data-pid="${p.id}" aria-label="Penalty points for ${escapeHtml(p.name)}" />
                  <button type="button" class="winner-btn" data-pid="${p.id}" id="win-${p.id}" title="Mark as Winner">W</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div class="action-bar">
          <button class="btn btn-primary btn-block btn-lg" id="submitRoundBtn">Submit Round</button>
        </div>
        <div class="action-bar">
          ${t.rounds.length > 0 ? `<button class="btn btn-secondary btn-sm" id="undoRoundBtn">Undo Last Round</button>` : ''}
        </div>
      `;
    }

    function bindPlay() {
      const t = state.activeTournament;
      if (!t) return;

      let winnerId = null;

      // Winner toggle
      document.querySelectorAll('.winner-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pid = btn.dataset.pid;
          if (winnerId === pid) {
            // Deselect
            winnerId = null;
            btn.classList.remove('active');
            document.getElementById(`score-${pid}`).disabled = false;
            document.getElementById(`score-${pid}`).value = '';
            document.getElementById(`card-${pid}`).classList.remove('is-winner');
          } else {
            // Clear previous
            if (winnerId) {
              const prev = document.getElementById(`win-${winnerId}`);
              if (prev) prev.classList.remove('active');
              const prevInput = document.getElementById(`score-${winnerId}`);
              if (prevInput) {
                prevInput.disabled = false;
                prevInput.value = '';
              }
              const prevCard = document.getElementById(`card-${winnerId}`);
              if (prevCard) prevCard.classList.remove('is-winner');
            }
            winnerId = pid;
            btn.classList.add('active');
            const input = document.getElementById(`score-${pid}`);
            input.value = '0';
            input.disabled = true;
            document.getElementById(`card-${pid}`).classList.add('is-winner');
          }
        });
      });

      // Keyboard nav: Enter moves to next score input (no autofocus — prevents keyboard popping open)
      const inputs = Array.from(document.querySelectorAll('.score-input'));
      inputs.forEach((input, idx) => {
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const next = inputs[idx + 1];
            if (next && !next.disabled) next.focus();
            else document.getElementById('submitRoundBtn')?.focus();
          }
        });
      });

      document.getElementById('submitRoundBtn')?.addEventListener('click', () => {
        if (!winnerId) {
          toast('Select a winner for this round', 'error');
          return;
        }

        const scores = {};
        let valid = true;
        const activePlayers = t.players.filter(p => !p.eliminated);

        for (const p of activePlayers) {
          const input = document.getElementById(`score-${p.id}`);
          if (p.id === winnerId) {
            scores[p.id] = 0;
            continue;
          }
          const raw = input.value.trim();
          if (raw === '') {
            input.classList.add('error');
            valid = false;
            continue;
          }
          const val = parseInt(raw, 10);
          if (isNaN(val) || val < 0 || val > 999) {
            input.classList.add('error');
            valid = false;
            continue;
          }
          input.classList.remove('error');
          scores[p.id] = val;
        }

        if (!valid) {
          toast('Enter valid non-negative scores for all players', 'error');
          return;
        }

        // Submit
        t.rounds.push({
          roundNumber: t.rounds.length + 1,
          scores,
          winnerId,
          timestamp: now()
        });

        recalculate(t);
        saveState();

        const winner = t.players.find(p => p.id === winnerId);
        const roundNum = t.rounds.length;

        // Check completion — stay on this page and show champion under the points table
        if (t.status === 'completed') {
          archiveTournament();
          toast(`Tournament complete! ${winner ? 'Champion: ' + winner.name : 'Tied'}`);
          render();
          return;
        }

        // Show brief confirmation then stay on play
        openModal(
          `Round ${roundNum} Complete`,
          `<p class="text-center" style="font-size:1.1rem;margin-bottom:8px">Winner</p>
           <p class="text-center font-bold" style="font-size:1.5rem;color:var(--green)">${escapeHtml(winner?.name || '')}</p>
           <p class="text-center text-muted text-sm mt-3">Scores saved. Standings updated.</p>`,
          `<button class="btn btn-primary btn-block" data-action="next">Next Round</button>
           <button class="btn btn-secondary btn-block" data-action="standings">View Standings</button>`
        ).then(action => {
          if (action === 'standings') {
            state.view = 'standings';
            state.activeNav = 'standings';
          } else {
            state.view = 'play';
            state.activeNav = 'play';
          }
          render();
        });
      });

      document.getElementById('undoRoundBtn')?.addEventListener('click', async () => {
        const ok = await confirmDialog(
          `Are you sure you want to remove Round ${t.rounds.length}?`,
          'This cannot be undone.',
          'Undo Round',
          true
        );
        if (!ok) return;
        t.rounds.pop();
        recalculate(t);
        // If undoing the final round, tournament may become active again
        saveState();
        toast('Last round removed');
        render();
      });

      // Buttons shown when tournament is completed (on play view)
      document.getElementById('newFromPlayBtn')?.addEventListener('click', () => {
        state.activeTournament = null;
        saveState();
        state.view = 'setup';
        render();
      });
      document.getElementById('homeFromPlayBtn')?.addEventListener('click', () => {
        if (state.activeTournament && state.activeTournament.status === 'completed') {
          archiveTournament();
          state.activeTournament = null;
          saveState();
        }
        state.view = 'home';
        render();
      });
    }

    // ----- STANDINGS -----
    function renderStandings() {
      const t = state.activeTournament;
      if (!t) { state.view = 'home'; return renderHome(); }

      return `
        <div class="round-header">
          <div class="tournament-name">${escapeHtml(t.name)}</div>
          <h2>Live Standings</h2>
          <p class="text-sm text-muted mt-2">Round ${t.rounds.length}${t.mode === 'standard' ? ` / ${t.maxRounds}` : ''} · Lower score is better</p>
        </div>

        <div class="card" style="padding:0;overflow:hidden">
          <table class="standings-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Score</th>
                <th>Wins</th>
                <th>Avg</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${t.players.map(p => {
                const avg = p.roundsPlayed ? (p.totalScore / p.roundsPlayed).toFixed(1) : '—';
                return `
                  <tr>
                    <td class="${rankClass(p.rank)}">#${p.rank}</td>
                    <td>
                      <button class="btn-ghost" style="padding:0;min-height:auto;font-weight:600;color:inherit" data-player="${p.id}">
                        ${escapeHtml(p.name)}
                      </button>
                    </td>
                    <td class="font-bold">${p.totalScore}</td>
                    <td>${p.wins}</td>
                    <td>${avg}</td>
                    <td>${playerStatusBadge(p, t)}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>

        <div class="action-bar">
          <button class="btn btn-primary" id="backToPlayBtn">Back to Scoring</button>
          ${t.rounds.length > 0 ? `<button class="btn btn-secondary btn-sm" id="editLastBtn">Edit Last Round</button>` : ''}
        </div>
      `;
    }

    // Bind player click & buttons after render for standings
    document.addEventListener('click', e => {
      if (state.view !== 'standings') return;
      const playerBtn = e.target.closest('[data-player]');
      if (playerBtn) {
        showPlayerDetail(playerBtn.dataset.player);
        return;
      }
      if (e.target.id === 'backToPlayBtn' || e.target.closest('#backToPlayBtn')) {
        state.view = 'play';
        state.activeNav = 'play';
        render();
      }
      if (e.target.id === 'editLastBtn' || e.target.closest('#editLastBtn')) {
        const t = state.activeTournament;
        if (t && t.rounds.length) {
          openEditRound(t.rounds.length - 1);
        }
      }
    });

    // ----- ROUNDS HISTORY -----
    function renderRounds() {
      const t = state.activeTournament;
      if (!t) { state.view = 'home'; return renderHome(); }

      if (t.rounds.length === 0) {
        return `
          <div class="empty-state">
            <h3>No rounds yet</h3>
            <p>Submit your first round to see history here.</p>
            <button class="btn btn-primary mt-4" id="goPlayFromRounds">Go to Scoring</button>
          </div>
        `;
      }

      return `
        <div class="round-header">
          <div class="tournament-name">${escapeHtml(t.name)}</div>
          <h2>Round History</h2>
        </div>
        ${t.rounds.map((r, idx) => {
          const winner = t.players.find(p => p.id === r.winnerId);
          const isOpen = state.expandedRounds[idx];
          return `
            <div class="round-history-item ${isOpen ? 'open' : ''}" data-idx="${idx}">
              <div class="round-history-header">
                <div>
                  <strong>Round ${r.roundNumber}</strong>
                  <span class="text-muted text-sm"> · Winner: ${escapeHtml(winner?.name || '—')}</span>
                </div>
                <div class="flex gap-2 items-center">
                  <button class="btn btn-ghost btn-sm edit-round-btn" data-idx="${idx}">Edit</button>
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="chevron" style="transition:transform .2s;${isOpen?'transform:rotate(180deg)':''}"><path d="m6 9 6 6 6-6"/></svg>
                </div>
              </div>
              <div class="round-history-body">
                ${Object.entries(r.scores).map(([pid, score]) => {
                  const p = t.players.find(x => x.id === pid);
                  const isW = pid === r.winnerId;
                  return `<div class="flex justify-between text-sm" style="padding:4px 0">
                    <span>${escapeHtml(p?.name || '?')} ${isW ? '<span class="status-badge status-winner">W</span>' : ''}</span>
                    <strong>${score}</strong>
                  </div>`;
                }).join('')}
              </div>
            </div>
          `;
        }).reverse().join('')}
      `;
    }

    function bindRounds() {
      document.getElementById('goPlayFromRounds')?.addEventListener('click', () => {
        state.view = 'play';
        state.activeNav = 'play';
        render();
      });

      document.querySelectorAll('.round-history-header').forEach(header => {
        header.addEventListener('click', e => {
          if (e.target.closest('.edit-round-btn')) return;
          const item = header.closest('.round-history-item');
          const idx = parseInt(item.dataset.idx, 10);
          state.expandedRounds[idx] = !state.expandedRounds[idx];
          item.classList.toggle('open');
          const chev = item.querySelector('.chevron');
          if (chev) chev.style.transform = state.expandedRounds[idx] ? 'rotate(180deg)' : '';
        });
      });

      document.querySelectorAll('.edit-round-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          e.stopPropagation();
          openEditRound(parseInt(btn.dataset.idx, 10));
        });
      });
    }

    // ----- EDIT ROUND -----
    async function openEditRound(roundIndex) {
      const t = state.activeTournament;
      if (!t || !t.rounds[roundIndex]) return;

      const round = t.rounds[roundIndex];
      // All players who participated (even if later eliminated)
      const pids = Object.keys(round.scores);

      let body = `<p class="text-sm text-muted mb-3">Editing Round ${round.roundNumber}. Changes will recalculate all standings and eliminations.</p>`;
      body += '<div id="editScoreCards">';
      pids.forEach(pid => {
        const p = t.players.find(x => x.id === pid);
        const isW = pid === round.winnerId;
        body += `
          <div class="player-score-card ${isW ? 'is-winner' : ''}" data-pid="${pid}" style="margin-bottom:10px">
            <div class="player-name mb-2">${escapeHtml(p?.name || '?')}</div>
            <div class="score-input-row">
              <input type="number" class="score-input edit-score" data-pid="${pid}"
                inputmode="numeric" min="0" max="999" value="${round.scores[pid]}"
                ${isW ? 'disabled' : ''} />
              <button type="button" class="winner-btn edit-winner ${isW ? 'active' : ''}" data-pid="${pid}" title="Mark as Winner">W</button>
            </div>
          </div>
        `;
      });
      body += '</div>';

      const result = await openModal(
        `Edit Round ${round.roundNumber}`,
        body,
        `<button class="btn btn-secondary" data-action="cancel">Cancel</button>
         <button class="btn btn-primary" data-action="save">Save Changes</button>`
      );

      if (result !== 'save') return;

      // Collect from modal DOM
      let winnerId = null;
      document.querySelectorAll('#modalBody .edit-winner.active').forEach(b => {
        winnerId = b.dataset.pid;
      });
      if (!winnerId) {
        toast('Select a winner', 'error');
        return openEditRound(roundIndex);
      }

      const scores = {};
      let valid = true;
      document.querySelectorAll('#modalBody .edit-score').forEach(input => {
        const pid = input.dataset.pid;
        if (pid === winnerId) {
          scores[pid] = 0;
          return;
        }
        const val = parseInt(input.value, 10);
        if (isNaN(val) || val < 0) {
          valid = false;
          return;
        }
        scores[pid] = val;
      });

      if (!valid) {
        toast('Invalid scores', 'error');
        return;
      }

      t.rounds[roundIndex] = {
        ...round,
        scores,
        winnerId,
        timestamp: now()
      };

      recalculate(t);
      saveState();

      if (t.status === 'completed') {
        archiveTournament();
        // Stay on current view (play/standings/rounds) so scores remain editable
      }
      toast('Round updated & recalculated');
      render();
    }

    // Wire edit winner buttons inside modal
    document.getElementById('modalBody').addEventListener('click', e => {
      const btn = e.target.closest('.edit-winner');
      if (!btn) return;
      const pid = btn.dataset.pid;
      document.querySelectorAll('#modalBody .edit-winner').forEach(b => {
        b.classList.remove('active');
        const input = document.querySelector(`#modalBody .edit-score[data-pid="${b.dataset.pid}"]`);
        if (input) { input.disabled = false; }
        const card = b.closest('.player-score-card');
        if (card) card.classList.remove('is-winner');
      });
      btn.classList.add('active');
      const input = document.querySelector(`#modalBody .edit-score[data-pid="${pid}"]`);
      if (input) { input.value = '0'; input.disabled = true; }
      const card = btn.closest('.player-score-card');
      if (card) card.classList.add('is-winner');
    });

    // ----- STATS -----
    function renderStats() {
      const t = state.activeTournament;
      if (!t) { state.view = 'home'; return renderHome(); }

      const leader = t.players.find(p => p.rank === 1);

      return `
        <div class="round-header">
          <div class="tournament-name">${escapeHtml(t.name)}</div>
          <h2>Player Statistics</h2>
        </div>

        ${t.players.map(p => {
          const avg = p.roundsPlayed ? (p.totalScore / p.roundsPlayed).toFixed(1) : '—';
          return `
            <div class="card mb-3" style="cursor:pointer" data-player="${p.id}">
              <div class="flex justify-between items-center mb-2">
                <strong>${escapeHtml(p.name)}</strong>
                ${playerStatusBadge(p, t)}
              </div>
              <div class="flex gap-3 text-sm text-muted" style="flex-wrap:wrap">
                <span>Total: <strong style="color:var(--text)">${p.totalScore}</strong></span>
                <span>Wins: ${p.wins}</span>
                <span>Avg: ${avg}</span>
                <span>High: ${p.highestRound ?? '—'}</span>
                <span>Low: ${p.lowestRound ?? '—'}</span>
              </div>
            </div>
          `;
        }).join('')}

        ${leader ? `<p class="text-center text-muted text-sm mt-4">Current leader: <strong>${escapeHtml(leader.name)}</strong></p>` : ''}
      `;
    }

    document.addEventListener('click', e => {
      if (state.view !== 'stats') return;
      const card = e.target.closest('[data-player]');
      if (card) showPlayerDetail(card.dataset.player);
    });

    // ----- PLAYER DETAIL -----
    function showPlayerDetail(pid) {
      const t = state.activeTournament;
      if (!t) return;
      const p = t.players.find(x => x.id === pid);
      if (!p) return;

      const avg = p.roundsPlayed ? (p.totalScore / p.roundsPlayed).toFixed(1) : '—';
      const roundRows = t.rounds.map((r, i) => {
        const score = r.scores[pid];
        if (score === undefined) return '';
        const isW = r.winnerId === pid;
        return `<div class="flex justify-between text-sm" style="padding:6px 0;border-bottom:1px solid var(--border-subtle)">
          <span>Round ${r.roundNumber} ${isW ? '<span class="status-badge status-winner">W</span>' : ''}</span>
          <strong>${score}</strong>
        </div>`;
      }).join('');

      openModal(
        p.name,
        `
          <div class="player-detail-stats mb-4">
            <div class="player-detail-stat"><div class="val">${p.totalScore}</div><div class="lbl">Total</div></div>
            <div class="player-detail-stat"><div class="val">${p.wins}</div><div class="lbl">Wins</div></div>
            <div class="player-detail-stat"><div class="val">${avg}</div><div class="lbl">Average</div></div>
            <div class="player-detail-stat"><div class="val">#${p.rank}</div><div class="lbl">Rank</div></div>
            <div class="player-detail-stat"><div class="val">${p.highestRound ?? '—'}</div><div class="lbl">Highest</div></div>
            <div class="player-detail-stat"><div class="val">${p.lowestRound ?? '—'}</div><div class="lbl">Lowest</div></div>
          </div>
          <div class="section-title">Round by Round</div>
          ${roundRows || '<p class="text-muted text-sm">No rounds played yet</p>'}
        `,
        `<button class="btn btn-secondary btn-block" data-action="close">Close</button>`
      );
    }

    // ----- RESULTS / WINNER -----
    function renderResults() {
      const t = state.activeTournament || state.history.find(h => h.id === state.viewingId);
      if (!t) { state.view = 'home'; return renderHome(); }

      const winner = t.players.find(p => p.id === t.winnerId);
      const isTie = t.status === 'completed' && !t.winnerId && t.mode === 'standard';

      let title = '🏆 TOURNAMENT COMPLETE';
      let sub = '';
      if (t.mode === 'elimination') {
        title = '🏆 LAST PLAYER STANDING';
      }
      if (isTie) {
        title = '🤝 TOURNAMENT TIED';
        const best = Math.min(...t.players.map(p => p.totalScore));
        const tied = t.players.filter(p => p.totalScore === best);
        sub = `<p class="text-muted">Tied at ${best} points: ${tied.map(p => escapeHtml(p.name)).join(', ')}</p>`;
      }

      return `
        <div class="winner-screen">
          <div class="winner-trophy">🏆</div>
          <div class="winner-label">${title}</div>
          ${winner ? `
            <div class="winner-name">${escapeHtml(winner.name)}</div>
            <div class="winner-meta">
              Final Score: ${winner.totalScore} · Wins: ${winner.wins}<br>
              ${escapeHtml(t.name)} · ${t.rounds.length} rounds
            </div>
          ` : sub}

          <div class="section-title">Final Standings</div>
          <div class="card" style="text-align:left;padding:0;overflow:hidden;margin-bottom:12px">
            <table class="standings-table">
              <thead>
                <tr><th>Rank</th><th>Player</th><th>Score</th><th>Wins</th><th>Status</th></tr>
              </thead>
              <tbody>
                ${t.players.map(p => `
                  <tr>
                    <td class="${rankClass(p.rank)}">#${p.rank}</td>
                    <td class="font-bold">${escapeHtml(p.name)}</td>
                    <td>${p.totalScore}</td>
                    <td>${p.wins}</td>
                    <td>${playerStatusBadge(p, t)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>

          <button class="btn btn-secondary btn-block points-table-toggle" id="viewPointsTableBtn">
            View Points Table
          </button>

          <div id="resultsPointsTablePanel" class="points-table-panel hidden">
            <div class="section-title" style="margin-top:0">Complete Points Table</div>
            ${renderPointsTable(t)}
          </div>

          <div class="hero-actions" style="max-width:100%">
            <button class="btn btn-primary btn-block" id="newFromResults">New Tournament</button>
            <button class="btn btn-ghost btn-block" id="backHomeFromResults">Back to Home</button>
          </div>
        </div>
      `;
    }

    // ----- HISTORY -----
    function renderHistory() {
      const hist = [...state.history].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      if (hist.length === 0) {
        return `
          <div class="section-title">Tournament History</div>
          <div class="empty-state">
            <h3>No tournaments yet</h3>
            <p>Completed tournaments will appear here.</p>
            <button class="btn btn-primary mt-4" id="startFromHist">Start Tournament</button>
          </div>
        `;
      }

      return `
        <div class="section-title">Tournament History</div>
        ${hist.map(t => {
          const winner = t.players.find(p => p.id === t.winnerId);
          return `
            <div class="history-card" data-id="${t.id}">
              <div class="history-card-top">
                <h4>${escapeHtml(t.name)}</h4>
                <span class="status-badge ${t.status === 'completed' ? 'status-champion' : 'status-active'}">${t.status}</span>
              </div>
              <div class="history-meta">
                <span>${formatDate(t.createdAt)}</span>
                <span>${t.players.length} players</span>
                <span>${t.rounds.length} rounds</span>
                <span>${t.mode === 'elimination' ? 'Elimination' : 'Standard'}</span>
                ${winner ? `<span>Winner: <strong>${escapeHtml(winner.name)}</strong></span>` : ''}
              </div>
              <div class="history-actions">
                <button class="btn btn-secondary btn-sm view-hist-btn" data-id="${t.id}">View</button>
                <button class="btn btn-danger btn-sm del-hist-btn" data-id="${t.id}">Delete</button>
              </div>
            </div>
          `;
        }).join('')}
        <div class="mt-4 flex flex-col gap-2">
          <button class="btn btn-danger btn-block" id="deleteAllHist">Delete All History</button>
          <button class="btn btn-ghost btn-block" id="backHomeHist">Back to Home</button>
        </div>
      `;
    }

    function bindHistory() {
      document.getElementById('startFromHist')?.addEventListener('click', () => {
        state.view = 'setup';
        render();
      });
      document.getElementById('backHomeHist')?.addEventListener('click', () => {
        state.view = 'home';
        render();
      });

      document.querySelectorAll('.view-hist-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const t = state.history.find(h => h.id === btn.dataset.id);
          if (t) {
            state.activeTournament = JSON.parse(JSON.stringify(t)); // temp view
            state.view = 'results';
            render();
          }
        });
      });

      document.querySelectorAll('.del-hist-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const ok = await confirmDialog('Delete this tournament from history?', 'This cannot be undone.', 'Delete', true);
          if (!ok) return;
          state.history = state.history.filter(h => h.id !== btn.dataset.id);
          saveState();
          toast('Tournament deleted');
          render();
        });
      });

      document.getElementById('deleteAllHist')?.addEventListener('click', async () => {
        const ok = await confirmDialog('Delete ALL tournament history?', 'This cannot be undone. Active tournament is not affected.', 'Delete All', true);
        if (!ok) return;
        state.history = [];
        saveState();
        toast('All history deleted');
        render();
      });
    }

    // ----- SETTINGS -----
    function renderSettings() {
      return `
        <div class="section-title">Settings</div>
        <div class="card mb-3">
          <div class="form-group">
            <label class="form-label">Appearance</label>
            <div class="pill-group" id="themePills">
              <button class="pill ${state.theme==='dark'?'active':''}" data-theme="dark">Dark</button>
              <button class="pill ${state.theme==='light'?'active':''}" data-theme="light">Light</button>
              <button class="pill ${state.theme==='system'?'active':''}" data-theme="system">System</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Custom Theme</label>
            <div class="custom-theme-grid" id="customThemeGrid">
              ${[['default','Crimson','#E50914'],['ocean','Ocean','#0EA5E9'],['emerald','Emerald','#10B981'],['violet','Violet','#8B5CF6'],['gold','Gold','#F59E0B'],['rose','Rose','#E11D48']].map(([v,n,c])=>`<button type="button" class="theme-swatch ${state.customTheme===v?'active':''}" data-custom-theme="${v}"><span style="background:${c}"></span>${n}</button>`).join('')}
              <label class="theme-swatch custom-picker ${state.customTheme==='custom'?'active':''}"><span style="background:${state.customTheme==='custom'?(state.customAccent||'#E50914'):'#666'}"></span>Custom<input id="customAccentPicker" type="color" value="${state.customAccent||'#E50914'}" aria-label="Custom accent color"></label>
            </div>
            <p class="form-hint">Choose an accent theme or create your own accent color.</p>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Destructive Actions</label>
            <div class="pill-group">
              <button class="pill ${state.settings.confirmDestructive?'active':''}" id="confirmOn">On</button>
              <button class="pill ${!state.settings.confirmDestructive?'active':''}" id="confirmOff">Off</button>
            </div>
          </div>
        </div>

        <div class="section-title">Data</div>
        <div class="card mb-3">
          <button class="btn btn-secondary btn-block mb-2" id="exportAllBtn">Export All Data (JSON)</button>
          <button class="btn btn-secondary btn-block mb-2" id="importBtn">Import Data</button>
          <input type="file" id="importFile" accept=".json,application/json" class="hidden" />
          <button class="btn btn-danger btn-block" id="clearHistoryBtn">Clear History</button>
        </div>

        <div class="section-title">About</div>
        <div class="card">
          <h3 class="font-bold mb-2">INSANE RUMMY TRACKER</h3>
          <p class="text-sm text-muted">Personal Rummy tournament scoring & management application. Not an online gambling platform. All data stays on your device.</p>
          <p class="text-sm text-muted mt-2">Lower score = better. Winner of a round scores 0. In 100-point elimination, 101+ eliminates a player.</p>
        </div>

        <button class="btn btn-ghost btn-block mt-4" id="settingsBack">Back</button>
      `;
    }

    function bindSettings() {
      document.getElementById('themePills')?.addEventListener('click', e => {
        const btn = e.target.closest('.pill');
        if (!btn) return;
        state.theme = btn.dataset.theme;
        applyTheme();
        saveState();
        render();
      });

      document.getElementById('customThemeGrid')?.addEventListener('click', e => {
        const btn = e.target.closest('[data-custom-theme]');
        if (!btn) return;
        state.customTheme = btn.dataset.customTheme;
        applyTheme();
        saveState();
        render();
      });
      document.getElementById('customAccentPicker')?.addEventListener('input', e => {
        state.customTheme = 'custom';
        state.customAccent = e.target.value;
        applyTheme();
        saveState();
        document.querySelectorAll('.theme-swatch').forEach(x => x.classList.remove('active'));
        e.target.closest('.theme-swatch')?.classList.add('active');
      });

      document.getElementById('confirmOn')?.addEventListener('click', () => {
        state.settings.confirmDestructive = true;
        saveState();
        render();
      });
      document.getElementById('confirmOff')?.addEventListener('click', () => {
        state.settings.confirmDestructive = false;
        saveState();
        render();
      });

      document.getElementById('exportAllBtn')?.addEventListener('click', () => {
        const data = {
          version: '4.2',
          exportedAt: now(),
          activeTournament: state.activeTournament,
          history: state.history,
          settings: state.settings
        };
        downloadJSON(data, `insane-rummy-backup-${Date.now()}.json`);
        toast('Backup exported');
      });

      document.getElementById('importBtn')?.addEventListener('click', () => {
        document.getElementById('importFile').click();
      });

      document.getElementById('importFile')?.addEventListener('change', async e => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          const data = JSON.parse(text);
          if (!data.version && !data.history && !data.activeTournament) {
            throw new Error('Invalid backup file');
          }
          const ok = await confirmDialog(
            'Import this backup? This will replace your current data.',
            'Make sure you have exported a backup first if needed.',
            'Import',
            true
          );
          if (!ok) return;
          state.activeTournament = data.activeTournament || null;
          state.history = data.history || [];
          if (data.settings) state.settings = { ...state.settings, ...data.settings };
          saveState();
          toast('Data imported successfully');
          state.view = 'home';
          render();
        } catch (err) {
          toast('Import failed: invalid file', 'error');
        }
        e.target.value = '';
      });

      document.getElementById('clearHistoryBtn')?.addEventListener('click', async () => {
        const ok = await confirmDialog('Clear all tournament history?', 'This cannot be undone. Active tournament is not affected.', 'Clear History', true);
        if (!ok) return;
        state.history = [];
        saveState();
        toast('History cleared');
        render();
      });

      document.getElementById('settingsBack')?.addEventListener('click', () => {
        state.view = 'home';
        render();
      });
    }

    // ----- POINTS TABLE IMAGE EXPORT -----
    async function downloadPointsTableImage(button) {
      const wrap = button?.previousElementSibling;
      if (!wrap || !wrap.classList.contains('points-table-wrap')) {
        toast('Points table not found', 'error');
        return;
      }
      if (typeof html2canvas !== 'function') {
        toast('Download feature could not load', 'error');
        return;
      }
      const originalText = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '⌛';
      try {
        const canvas = await html2canvas(wrap, {
          backgroundColor: getComputedStyle(document.body).backgroundColor || '#ffffff',
          scale: Math.min(3, Math.max(2, window.devicePixelRatio || 1)),
          useCORS: true, logging: false, removeContainer: true
        });
        const t = state.activeTournament;
        const safeName = (t?.name || 'INSANE-RUMMY-TOURNAMENT')
          .replace(/[^a-z0-9]+/gi, '-')
          .replace(/^-+|-+$/g, '').slice(0, 60) || 'INSANE-RUMMY-TOURNAMENT';
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('PNG creation failed');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${safeName}-points-table.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Points table downloaded');
      } catch (err) {
        console.error('Points table image export failed:', err);
        toast('Could not download points table', 'error');
      } finally {
        button.disabled = false;
        button.innerHTML = originalText;
      }
    }


    // ----- ARCHIVE / EXPORT -----
    function archiveTournament() {
      if (!state.activeTournament) return;
      const t = JSON.parse(JSON.stringify(state.activeTournament));
      // Avoid duplicates
      const exists = state.history.findIndex(h => h.id === t.id);
      if (exists >= 0) {
        state.history[exists] = t;
      } else {
        state.history.unshift(t);
      }
      // Keep active for results view, but mark completed
      saveState();
    }

    function downloadJSON(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function exportTournamentCSV(t) {
      let csv = `Tournament,${t.name}\nDate,${t.createdAt}\nMode,${t.mode}\nRounds,${t.rounds.length}\n\n`;
      csv += 'Rank,Player,Total Score,Wins,Status\n';
      t.players.forEach(p => {
        const status = p.eliminated ? 'Eliminated' : (t.winnerId === p.id ? 'Champion' : 'Active');
        csv += `${p.rank},${p.name},${p.totalScore},${p.wins},${status}\n`;
      });
      csv += '\nRound Details\n';
      t.rounds.forEach(r => {
        csv += `\nRound ${r.roundNumber}\nPlayer,Score,Winner\n`;
        Object.entries(r.scores).forEach(([pid, score]) => {
          const p = t.players.find(x => x.id === pid);
          csv += `${p?.name || '?'},${score},${pid === r.winnerId ? 'Yes' : ''}\n`;
        });
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${t.name.replace(/\s+/g, '-')}-results.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ----- HELP -----
    function showHelp() {
      openModal(
        'How to Play',
        `
          <p class="mb-3"><strong>INSANE RUMMY TRACKER</strong> is a personal scoring app for Rummy tournaments among friends.</p>
          <p class="mb-2"><strong>Standard Mode</strong></p>
          <ul style="margin-left:18px;margin-bottom:12px;color:var(--text-muted);font-size:0.9rem">
            <li>Choose number of rounds (1–20)</li>
            <li>Each round, mark one Winner (scores 0)</li>
            <li>Enter penalty points for others</li>
            <li>Lowest cumulative score wins</li>
          </ul>
          <p class="mb-2"><strong>100-Point Elimination</strong></p>
          <ul style="margin-left:18px;margin-bottom:12px;color:var(--text-muted);font-size:0.9rem">
            <li>Players are eliminated at 101+ cumulative points</li>
            <li>Exactly 100 is still safe</li>
            <li>Last remaining player is the champion</li>
          </ul>
          <p class="text-sm text-muted">You can edit past rounds and undo the last round. Everything is saved automatically on your device.</p>
        `,
        `<button class="btn btn-primary btn-block" data-action="close">Got it</button>`
      );
    }


    // ----- NAVIGATION CALCULATOR -----
    function openCalculator(){const body=`<div id="navCalcDisplay" style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:right;font-size:1.7rem;font-weight:800;min-height:58px;margin-bottom:12px">0</div><div class="calculator-grid" id="navCalcKeys"><button class="btn btn-secondary" data-calc="clear">AC</button><button class="btn btn-secondary" data-calc="back">⌫</button><button class="btn btn-secondary" data-calc="%">%</button><button class="btn btn-secondary" data-calc="/">÷</button><button class="btn btn-secondary" data-calc="7">7</button><button class="btn btn-secondary" data-calc="8">8</button><button class="btn btn-secondary" data-calc="9">9</button><button class="btn btn-secondary" data-calc="*">×</button><button class="btn btn-secondary" data-calc="4">4</button><button class="btn btn-secondary" data-calc="5">5</button><button class="btn btn-secondary" data-calc="6">6</button><button class="btn btn-secondary" data-calc="-">−</button><button class="btn btn-secondary" data-calc="1">1</button><button class="btn btn-secondary" data-calc="2">2</button><button class="btn btn-secondary" data-calc="3">3</button><button class="btn btn-secondary" data-calc="+">+</button><button class="btn btn-secondary" data-calc="0" style="grid-column:span 2">0</button><button class="btn btn-secondary" data-calc=".">.</button><button class="btn btn-primary" data-calc="=">=</button></div>`;openModal('Calculator',body,'');setTimeout(()=>{let expr='';const d=document.getElementById('navCalcDisplay'),u=()=>d.textContent=expr||'0';document.querySelectorAll('#navCalcKeys [data-calc]').forEach(b=>b.onclick=()=>{const v=b.dataset.calc;if(v==='clear')expr='';else if(v==='back')expr=expr.slice(0,-1);else if(v==='='){try{const safe=expr.replace(/%/g,'/100');if(!expr||!/^[0-9+\-*/(). ]+$/.test(safe))throw 0;const n=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(n))throw 0;expr=String(Math.round(n*1e10)/1e10)}catch{expr='Error'}}else if(expr==='Error')expr=/[0-9.]/.test(v)?v:'';else expr+=v;u()});},0)}

    // ---------- EVENT DELEGATION ----------
    document.getElementById('homeBtn').addEventListener('click', () => {
      // If we were viewing a completed tournament results, clear active so refresh stays on home
      if (state.activeTournament && state.activeTournament.status === 'completed') {
        archiveTournament();
        state.activeTournament = null;
        saveState();
      }
      state.view = 'home';
      render();
    });
    document.getElementById('settingsBtn').addEventListener('click', () => {
      state.view = 'settings';
      render();
    });


    document.getElementById('modalClose').addEventListener('click', () => closeModal(null));
    document.getElementById('modalOverlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modalOverlay')) closeModal(null);
    });

    document.getElementById('modalFooter').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (btn) closeModal(btn.dataset.action);
    });

    // Bottom nav
    document.getElementById('bottomNav').addEventListener('click', e => {
      const btn = e.target.closest('.nav-item');
      if (!btn) return;
      if (btn.id === 'navCalculator') { openCalculator(); return; }
      const view = btn.dataset.view;
      state.activeNav = view;
      if (view === 'play') state.view = 'play';
      else if (view === 'standings') state.view = 'standings';
      else if (view === 'history') state.view = 'rounds';
      else if (view === 'stats') state.view = 'stats';
      render();
    });

    // Home buttons (delegated because re-rendered)
    document.getElementById('mainContent').addEventListener('click', async e => {
      if (e.target.id === 'newTournamentBtn' || e.target.closest('#newTournamentBtn')) {
        if (state.activeTournament && state.activeTournament.status === 'active') {
          const ok = await confirmDialog(
            'You have an unfinished tournament. Starting a new one will discard it.',
            'Consider finishing or exporting it first.',
            'Discard & Start New',
            true
          );
          if (!ok) return;
          state.activeTournament = null;
          saveState();
        }
        state.view = 'setup';
        render();
        return;
      }
      if (e.target.id === 'playRummyAIBtn' || e.target.closest('#playRummyAIBtn')) {
        rummyAI = {screen:'setup'};
        state.view = 'rummyAI';
        render();
        return;
      }
      if (e.target.id === 'historyBtn' || e.target.closest('#historyBtn')) {
        state.view = 'history';
        render();
        return;
      }
      const downloadPointsBtn = e.target.closest('[data-download-points-table]');
      if (downloadPointsBtn) {
        await downloadPointsTableImage(downloadPointsBtn);
        return;
      }
      if (e.target.id === 'helpBtn' || e.target.closest('#helpBtn')) {
        showHelp();
        return;
      }
      if (e.target.id === 'resumeBtn' || e.target.closest('#resumeBtn')) {
        state.view = 'play';
        state.activeNav = 'play';
        render();
        return;
      }
      if (e.target.id === 'discardBtn' || e.target.closest('#discardBtn')) {
        const ok = await confirmDialog('Discard the unfinished tournament?', 'This cannot be undone.', 'Discard', true);
        if (!ok) return;
        state.activeTournament = null;
        saveState();
        toast('Tournament discarded');
        render();
        return;
      }
      if (e.target.id === 'viewPointsTableBtn' || e.target.closest('#viewPointsTableBtn')) {
        const btn = document.getElementById('viewPointsTableBtn');
        const panel = document.getElementById('resultsPointsTablePanel');
        if (btn && panel) {
          const isHidden = panel.classList.contains('hidden');
          panel.classList.toggle('hidden', !isHidden);
          btn.textContent = isHidden ? 'Hide Points Table' : 'View Points Table';
        }
        return;
      }
      if (e.target.id === 'newFromResults' || e.target.closest('#newFromResults')) {
        state.activeTournament = null;
        saveState();
        state.view = 'setup';
        render();
        return;
      }
      if (e.target.id === 'backHomeFromResults' || e.target.closest('#backHomeFromResults')) {
        state.activeTournament = null;
        state.view = 'home';
        render();
        return;
      }
    });

    // Escape HTML
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // System theme listener
    window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (state.theme === 'system') applyTheme();
    });

    // Keyboard: Escape closes modal
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const overlay = document.getElementById('modalOverlay');
        if (overlay.classList.contains('open')) closeModal(null);
      }
    });

    // ---------- INIT ----------
    loadState();
    // If a completed tournament is still marked active (from previous session),
    // archive it properly and clear so refresh always lands on home.
    if (state.activeTournament && state.activeTournament.status === 'completed') {
      archiveTournament();
      state.activeTournament = null;
      saveState();
    }
    state.view = 'home';
    render();
  </script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
